name: Build and publish Docker image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate application and container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run syntax checks and application tests
        run: node scripts/check.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Build local test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: skyblock-smoke:test
      - name: Verify container startup and icon
        run: |
          docker run -d --name smoke --read-only --cap-drop ALL --security-opt no-new-privileges:true --init -p 127.0.0.1:8080:3000 skyblock-smoke:test
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          # Docker can accept TCP before Node is ready, then reset the connection.
          # Retry receive errors too, but fail if the app never becomes available.
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 --retry-max-time 60 --connect-timeout 2 --max-time 5 http://127.0.0.1:8080/healthz
          curl --fail --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 20 --connect-timeout 2 --max-time 5 http://127.0.0.1:8080/app-icon.png -o /tmp/app-icon.png

  publish:
    name: Publish verified main image
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compute image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish amd64 and arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
